<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소등 — Lights Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<style>
/* 모달(인물·일지·결과 카드)은 시스템 테마를 따른다. 게임 화면 자체는 지하의 어둠이라 항상 어둡다. */
:root{
  --surface:#ECEEF0; --surface2:#E1E4E8; --ink:#17181A; --muted:#5E636B; --line:#BEC3CA;
  --amber:#A8740F; --amberInk:#7A5408;
  --relief:#2F7A4C; --hope:#A8740F; --heavy:#A8382E; --crisis:#6E1C1C;
  --btn:#17181A; --btnInk:#ECEEF0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#1B1915; --surface2:#24211C; --ink:#E9E3D6; --muted:#9E978A; --line:#3A352D;
    --amber:#E0A526; --amberInk:#E0A526;
    --relief:#5FAE79; --hope:#E0A526; --heavy:#D0604F; --crisis:#B5403A;
    --btn:#E0A526; --btnInk:#161616; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#1B1915; --surface2:#24211C; --ink:#E9E3D6; --muted:#9E978A; --line:#3A352D;
  --amber:#E0A526; --amberInk:#E0A526;
  --relief:#5FAE79; --hope:#E0A526; --heavy:#D0604F; --crisis:#B5403A;
  --btn:#E0A526; --btnInk:#161616; color-scheme:dark;
}
/* 게임 화면 고정 색 */
:root{--g-bg:#0B0A08; --g-panel:#15130E; --g-edge:#3D3426; --g-ink:#ECE4D2; --g-dim:#A89C84; --g-amber:#E0A526; --g-ash:#D9DDE3;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--g-bg)}
body{color:var(--g-ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--g-amber);outline-offset:2px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* HUD */
.hud{flex:none;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:7px 16px;background:linear-gradient(#1E1A12,#110F0A);border-bottom:1px solid var(--g-edge);min-height:58px;position:relative;z-index:5}
.hday{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.hday b{font-family:'Noto Serif KR',serif;font-weight:900;font-size:28px;color:var(--g-amber);line-height:1;white-space:nowrap}
.hday span{font-size:13px;color:var(--g-dim);white-space:nowrap}
.hday span i{font-style:normal;color:var(--g-amber)}
.meters{display:flex;gap:6px;flex-wrap:wrap}
.mt{background:#0E0C08;border:1px solid #5A4A2E;border-radius:4px;padding:3px 10px 5px;min-width:104px;box-shadow:inset 0 0 0 1px #000}
.mt small{font-size:11px;color:var(--g-dim);margin-right:5px}
.mt b{font-size:16px;color:var(--g-amber);font-weight:900;font-variant-numeric:tabular-nums}
.mt.bad b{color:#E06A50}
.mt .bar{height:3px;background:#2a2418;margin-top:3px}
.mt .bar i{display:block;height:100%;background:var(--g-amber)}
.mt.bad .bar i{background:#E06A50}
.res{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--g-dim);align-items:center}
.res b{color:var(--g-ink);font-weight:700;font-variant-numeric:tabular-nums;margin-left:3px}
.res .bad b{color:#E06A50}
.res .looks b{color:var(--g-amber)}
.hbtns{display:flex;gap:6px}
.hb{background:#0E0C08;border:1px solid #5A4A2E;color:var(--g-ink);border-radius:4px;padding:6px 12px;font-size:13px}
.hb:hover{border-color:var(--g-amber)}

/* 무대 */
.stage{flex:1;position:relative;overflow:hidden;background:var(--g-bg);min-height:0}
#world{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;left:0;top:0}
#spots{position:absolute;inset:0;pointer-events:none;z-index:2}
.spot{pointer-events:auto;position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:0;padding:0;background:transparent}
.spot::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#EEE9DA;box-shadow:0 0 0 2px rgba(20,17,12,.85),0 0 10px rgba(238,233,218,.6)}
.spot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(238,233,218,.7);animation:ring 2.4s ease-out infinite}
.spot.spent::before{background:#8A8577;box-shadow:0 0 0 2px rgba(20,17,12,.85)}
.spot.spent::after{animation:none;opacity:0}
.spot .lbl{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:rgba(14,12,8,.94);border:1px solid var(--g-edge);border-radius:4px;padding:3px 8px;font-size:12px;color:var(--g-ink);opacity:0;pointer-events:none;transition:opacity .15s}
.spot:hover .lbl,.spot:focus-visible .lbl{opacity:1}
@keyframes ring{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.locked .spot{opacity:.35}
.locked .spot::after{animation:none}

.eventtag{position:absolute;top:14px;left:18px;z-index:3;text-shadow:0 2px 8px #000;pointer-events:none}
.eventtag small{display:inline-block;font-size:12px;color:#161616;background:var(--g-amber);padding:1px 8px;border-radius:2px;margin-bottom:6px;font-weight:700}
.eventtag b{display:block;font-family:'Noto Serif KR',serif;font-size:clamp(20px,2.4vw,32px);font-weight:900;color:var(--g-ink)}
.eventtag em{font-style:normal;font-size:13px;color:var(--g-dim)}
.signaltag{position:absolute;top:14px;right:18px;z-index:3;text-align:right;font-size:12.5px;color:var(--g-ash);text-shadow:0 1px 6px #000;background:rgba(10,9,7,.55);padding:6px 10px;border-radius:4px;border:1px solid rgba(90,74,46,.6)}
.signaltag .dots{color:var(--g-amber);letter-spacing:2px}

/* 하단 대화 영역 */
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:72px 4% 14px;background:linear-gradient(to bottom,rgba(10,9,7,0),rgba(10,9,7,.9) 56px,rgba(10,9,7,.97));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.bottom>*{pointer-events:auto}
.bottom.empty{display:none}
.dialog{width:min(820px,100%);font-family:'Noto Serif KR',serif;font-size:16.5px;line-height:1.85;color:var(--g-ink);cursor:pointer;max-height:30vh;overflow:auto;position:relative}
.dialog:empty{display:none}
.dialog .head{font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--g-dim);margin-bottom:2px}
.line{margin:0;opacity:.5}
.line.cur{opacity:1}
.line .who{font-family:'Noto Sans KR',sans-serif;font-weight:700;color:var(--g-amber);font-size:13.5px;margin-right:8px}
.line.dark .who{color:#8E949C}
.dfoot{display:flex;justify-content:space-between;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--g-dim);margin-top:4px}
.dfoot .go{color:var(--g-amber)}
.dialog.compact{max-height:3.9em}
.prompt{font-family:'Noto Serif KR',serif;font-weight:600;font-size:15.5px;color:var(--g-ink);width:min(1180px,100%)}
.prompt:empty{display:none}
.choices{width:min(1180px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choices:empty{display:none}
.opt{text-align:left;background:rgba(22,19,14,.96);border:1px solid #4B4130;border-radius:6px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;color:var(--g-ink)}
.opt:hover:not([disabled]){border-color:var(--g-amber);background:rgba(34,29,20,.98)}
.opt[disabled]{opacity:.42;cursor:not-allowed}
.opt .k{font-family:'Noto Serif KR',serif;font-weight:900;font-size:18px;color:var(--g-amber);line-height:1;margin-right:6px}
.opt h3{margin:0;font-size:15px;font-weight:700;line-height:1.35;display:flex;align-items:baseline}
.opt p{margin:0;color:var(--g-dim);font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:3px;background:#221E16;border:1px solid #3F3627;white-space:nowrap;color:#D9CFBA}
.tag.q{border-style:dashed;color:#E58B74;border-color:#7A4436}
.tag.back{color:var(--g-amber)}
.tag.c{color:#F1D79A;border-color:#6D5A31}
.risk{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g-dim);border-top:1px dashed #3F3627;padding-top:6px}
.risk .bar{flex:1;height:5px;background:#2A251B;overflow:hidden}
.risk .bar i{display:block;height:100%}
.risk b{font-variant-numeric:tabular-nums;color:var(--g-ink)}
.why{font-size:12px;color:#E58B74}

/* 살핌 팝오버 · 알림 */
.pop{position:absolute;z-index:6;width:min(320px,calc(100% - 20px));background:rgba(18,16,11,.97);border:1px solid #5A4A2E;border-radius:6px;padding:12px 14px;color:var(--g-ink);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.pop h4{margin:0 0 4px;font-size:15px;font-family:'Noto Serif KR',serif}
.pop .inf{font-size:13px;color:var(--g-dim);margin-bottom:8px}
.pop .act{display:block;width:100%;text-align:left;background:#221E16;border:1px solid #4B4130;border-radius:5px;padding:8px 10px;margin-top:6px}
.pop .act:hover:not([disabled]){border-color:var(--g-amber)}
.pop .act[disabled]{opacity:.5;cursor:not-allowed}
.pop .act b{display:block;font-size:13.5px;margin-bottom:4px}
.pop .pf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--g-dim)}
.pop .pf button{background:none;border:0;color:var(--g-dim);font-size:12px}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:7;width:min(480px,92%);background:rgba(18,16,11,.97);border:1px solid var(--g-amber);border-radius:6px;padding:10px 14px;font-size:14px;color:var(--g-ink);font-family:'Noto Serif KR',serif;transition:opacity .4s}
.toast .fx{margin-top:6px}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(6,6,6,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px;overflow:auto;z-index:20}
.panel{background:var(--surface);color:var(--ink);border-radius:10px;max-width:640px;width:100%;border:1px solid var(--line);overflow:hidden;margin:auto 0}
.panel.wide{max-width:860px}
.lab{padding:11px 18px;color:#fff;font-weight:700;font-size:14px}
.lab.relief{background:var(--relief)}.lab.hope{background:var(--hope);color:#161616}.lab.heavy{background:var(--heavy)}.lab.crisis{background:var(--crisis)}.lab.plain{background:var(--surface2);color:var(--ink)}
.pbody{padding:16px 20px 18px}
.pbody h2{font-family:'Noto Serif KR',serif;font-size:20px;margin:0 0 6px;font-weight:900}
.sec{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:10px}
.sec h4{margin:0 0 4px;font-size:12.5px;color:var(--muted);font-weight:500}
.sec .txt{font-family:'Noto Serif KR',serif;font-size:15.5px;line-height:1.75}
.fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fx span{font-size:12px;padding:2px 7px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.fx span.g{border-color:var(--hope);color:var(--amberInk)}
.fx span.r{border-color:var(--heavy);color:var(--heavy)}
.toast .fx span{background:#221E16;border-color:#3F3627;color:#D9CFBA}
.toast .fx span.g{color:var(--g-amber);border-color:#6D5A31}
.toast .fx span.r{color:#E58B74;border-color:#7A4436}
.sub{font-size:12.5px;color:var(--muted)}
.event-line{font-size:13.5px;margin:4px 0;padding-left:10px;border-left:3px solid var(--line)}
.event-line.r{border-color:var(--crisis)}.event-line.g{border-color:var(--hope)}
.actions{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}
.btn{background:var(--btn);color:var(--btnInk);border:0;border-radius:7px;padding:10px 20px;font-weight:700}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface2)}
.pc.gone{opacity:.45}
.pc h5{margin:0;font-size:14.5px}
.pc h5 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.meter{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px}
.meter .bar{flex:1;height:5px;background:var(--surface);border-radius:3px;overflow:hidden}
.meter .bar i{display:block;height:100%}
.pc .ab{font-size:11.5px;color:var(--muted);margin-top:5px}
.pc .stt{font-size:11.5px;color:var(--heavy);margin-top:3px}
.logrow{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.logrow b{font-family:'Noto Serif KR',serif}
.dotlab{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* 타이틀 · 엔딩 */
.cover{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:center;padding:5% 7%;color:var(--g-ink);background:linear-gradient(90deg,rgba(10,9,7,.93) 0%,rgba(10,9,7,.62) 50%,rgba(10,9,7,.05) 100%)}
.cover h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(54px,10vw,140px);line-height:.95;margin:0;letter-spacing:-.02em}
.cover .en{font-size:clamp(12px,1.4vw,16px);color:var(--g-ash);letter-spacing:.5em;margin:10px 0 0 4px}
.cover .lead{font-family:'Noto Serif KR',serif;color:#C8C0AE;max-width:30em;margin:18px 0 24px;font-size:clamp(13px,1.5vw,17px)}
.cover .row{display:flex;gap:10px;flex-wrap:wrap}
.cbtn{background:var(--g-amber);color:#161616;border:0;border-radius:6px;padding:11px 22px;font-weight:700}
.cbtn.alt{background:transparent;color:var(--g-ink);border:1px solid #5a554d}
.cbtn:disabled{opacity:.4;cursor:not-allowed}
.endgrid{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap}
.endgrid span{font-size:12px;border:1px solid #4a463f;border-radius:4px;padding:3px 8px;color:#8a857b}
.endgrid span.got{border-color:var(--g-amber);color:var(--g-amber)}
.ending h1{font-size:clamp(36px,6vw,76px)}
.ending .lead{font-size:clamp(14px,1.7vw,19px);line-height:1.8}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.spot::after{animation:none}}

/* 세로 화면(휴대폰): 장면은 위, 대화와 선택은 아래로 */
@media (max-aspect-ratio:1/1){
  body{overflow:auto}
  #app{position:static;min-height:100vh}
  .hud{position:sticky;top:0;padding:6px 10px}
  .hday b{font-size:22px}
  .mt{min-width:0;padding:2px 7px 4px}.mt b{font-size:14px}
  .stage{flex:none;width:100%;padding-top:56.25%;overflow:visible}
  .mt .bar{display:none}
  .hb{padding:4px 10px}
  .bottom{position:static;background:#0E0C09;padding:12px 12px 20px}
  .dialog{max-height:none;font-size:15.5px}
  .dialog.compact{max-height:none}
  .choices{grid-template-columns:1fr}
  .signaltag{display:none!important}
  .eventtag b{font-size:18px}
  .eventtag em{display:none}
  .eventtag{top:8px;left:10px}
  .cover{padding:6%}
  .cover h1{font-size:clamp(44px,16vw,90px)}
  .toast{top:10px}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud">
    <div class="hday" id="hday"><b>소등</b><span>Lights Out</span></div>
    <div class="meters" id="meters"></div>
    <div class="res" id="res"></div>
    <div class="hbtns"><button class="hb" id="btnPeople">인물</button><button class="hb" id="btnLog">일지</button></div>
  </header>
  <section class="stage" id="stage">
    <div id="spots"></div>
    <div class="eventtag" id="eventtag"></div>
    <div class="signaltag hidden" id="signaltag"></div>
    <div class="bottom empty" id="bottom">
      <div class="dialog" id="dialog" role="log" aria-live="polite"></div>
      <div class="prompt" id="prompt"></div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="cover hidden" id="cover"></div>
  </section>
</div>
<div class="modal hidden" id="modal"><div class="panel" id="panel"></div></div>
<script>
'use strict';
/* ============ 기본 유틸 ============ */
const SAVE_KEY='sodeung_save_v1', END_KEY='sodeung_endings_v1';
const store={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const roll=()=>Math.floor(Math.random()*100)+1;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sgn=n=>n>0?'+'+n:n<0?'−'+Math.abs(n):'±0';
function josa(w,a,b){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+b;return w+(((c-0xAC00)%28)?a:b);}

/* ============ 인물 ============ */
const CHARS=[
 {id:'dokyung',name:'한도경',short:'도경',age:41,sex:'남',job:'새봄역 부역장',hp:90,mo:65,ab:'리더 · 6일차 보강 +15 · 역무실 비상함을 안다'},
 {id:'yunhee',name:'서윤희',short:'윤희',age:36,sex:'여',job:'역 앞 약국 약사',hp:85,mo:60,ab:'간병 +5/일 · 의약품 치료 +20'},
 {id:'mansuk',name:'박만석',short:'만석',age:68,sex:'남',job:'역 미화원',hp:55,mo:55,ab:'무릎 부상 · 원정·방어 불가'},
 {id:'haneul',name:'박하늘',short:'하늘',age:8,sex:'여',job:'만석의 손녀',hp:85,mo:75,ab:'원정·방어 불가 · 작은 숨 「할아버지 그림」'},
 {id:'daeun',name:'정다은',short:'다은',age:17,sex:'여',job:'고등학생',hp:85,mo:70,ab:'발소리가 가볍다 · 원정 성공률 +10%'},
 {id:'sungjin',name:'오성진',short:'성진',age:29,sex:'남',job:'배달 라이더',hp:90,mo:70,ab:'원정 실패 피해 절반 · 작은 숨 「계단 위 이야기」'},
 {id:'miso',name:'김미소',short:'미소',age:33,sex:'여',job:'어린이집 교사',hp:80,mo:60,ab:'다독임: 밤 소리 −3 · 작은 숨 「속삭이는 동화」'},

 {id:'jinseok',name:'유진석',short:'진석',age:52,sex:'남',job:'지하철 전기 기술자',hp:70,mo:60,ab:'전기 담당 · 작은 숨 「라디오 잡음」'},

const avgMo=()=>{const l=live();return l.length?Math.round(l.reduce((a,p)=>a+p.mo,0)/l.length):0;};

const moBand=m=>m>=80?'희망':m>=50?'불안':m>=25?'절망':'붕괴';

function caregiverId(){
  const need=live().some(p=>p.care==='med'||(p.isolated&&p.bite&&p.bite.rule==='A'));
  if(!need)return null;
  const m=ORDER.med.map(P).find(p=>here(p)&&!p.isolated&&p.hp>=20);
  return m?m.id:null;
}
function able(p){return here(p)&&!p.isolated&&p.hp>=50&&!WEAK.includes(p.id)&&p.id!==caregiverId();}
function fill(slots){
  const used=[],team=[];
  for(const sl of slots){
    let p=P(sl.want);
    if(!(able(p)&&!used.includes(p.id))){p=null;for(const id of ORDER[sl.role]){const q=P(id);if(able(q)&&!used.includes(id)){p=q;break;}}}
    if(!p)return null;
    used.push(p.id);team.push({p,sub:p.id!==sl.want,want:sl.want});
  }
  return team;
}
function expChance(team,base){
  const minH=Math.min(...team.map(t=>t.p.hp)),minM=Math.min(...team.map(t=>t.p.mo));
  let c=base+(minH>=80?10:-10)+(minM>=80?10:minM>=50?0:-10);
  if(team.some(t=>t.p.id==='daeun'))c+=10;
  if(S.jisuJoined)c+=5; if(S.community>=3)c+=5; if(S.hope>=2)c+=5; if(S.today&&S.today.scout)c+=5;
  return clamp(c,10,95);
}
function judge(c,half=true){const r=roll();if(r<=c)return{r,res:'ok'};if(half&&r-c<=10)return{r,res:'half'};return{r,res:'fail'};}

function res(k,n,fx){const max=(k==='food'||k==='water')?100:999;const b=S[k];S[k]=clamp(S[k]+n,0,max);const d=S[k]-b;if(fx&&d)fx.push(`${RN[k]} ${sgn(d)}`);return d;}
function mo(id,n,fx){const p=typeof id==='string'?P(id):id;if(!here(p)||!n)return;p.mo=clamp(p.mo+n,0,100);if(fx)fx.push(`${p.short} 사기 ${sgn(n)}`);}
function moAll(n,fx,label){if(!n)return;live().forEach(p=>p.mo=clamp(p.mo+n,0,100));if(fx)fx.push(`${label||'사기(전체)'} ${sgn(n)}`);}
function checkFlags(p){
  if(!here(p))return;
  if(p.hp<=49&&!p.flagS){p.flagS=true;S.queue.push({t:'med',id:p.id,kind:p.hp<=19?'빈사':'중상'});if(p.hp<=19)p.flagD=true;}
  else if(p.hp<=19&&!p.flagD){p.flagD=true;if(!S.queue.some(q=>q.t==='med'&&q.id===p.id))S.queue.push({t:'med',id:p.id,kind:'빈사'});}
}
function hpd(id,n,fx){const p=typeof id==='string'?P(id):id;if(!here(p)||!n)return;let v=clamp(p.hp+n,0,100);if(S.day<=3&&v<1)v=1;const d=v-p.hp;p.hp=v;if(fx&&d)fx.push(`${p.short} 체력 ${sgn(d)}`);checkFlags(p);}
function hpAll(n,fx){live().forEach(p=>hpd(p,n));if(fx)fx.push(`체력(전체) ${sgn(n)}`);}
function kill(p,cause,shock){
  if(!here(p))return false;
  if(S.day<=3&&cause!=='변이'){p.hp=Math.max(1,p.hp);return false;}
  p.alive=false;p.cause=cause;p.deathDay=S.day;p.care=null;p.isolated=false;
  S.lostToday.push({id:p.id,shock:shock==null?8:shock,cause});return true;
}
function useMed(p,fx){
  res('meds',-1,fx);res('water',-2,fx);
  const y=P('yunhee');let a=(here(y)&&!y.isolated)?20:15;if(S.blackout)a=Math.floor(a/2);
  hpd(p,a,fx);p.quiet=3;p.care=null;
}
function biteSuspect(p,fx,chain){
  if(!here(p)||p.bite)return;
  const inf=roll()<=50;
  p.bite={day:S.day,inf,fever:inf||roll()<=30,chain:!!chain,rule:null};
  if(fx)fx.push(`${p.short} 물림 의심 ?`);
  if(S.biteRule)applyBiteRule(p);
  else if(!S.queue.some(q=>q.t==='bite'))S.queue.unshift({t:'bite',id:p.id});
}
function applyBiteRule(p){p.bite.rule=S.biteRule;if(S.biteRule!=='C')p.isolated=true;}

const density=()=>S.day<=3?0:S.day<=7?5:S.day<=10?15:10;
const defense=()=>5+S.reinforced+S.defPerm;
function personSound(){
  let s=0;live().forEach(p=>{if(p.quiet>0)return;if(p.hp<=19)s+=6;else if(p.hp<=49)s+=3;});
  if(here(P('wujin')))s+=3;return s;
}
function nightRisk(o){
  o=o||{};const t=S.tonight;
  const off=t.lightsOff||o.lightsOff;
  let living=(S.blackout||off)?0:(S.screen?2:5);if(t.lowLantern)living=Math.floor(living/2);
  const lights=t.lights.slice();if(o.light)lights.push({v:o.light,stairs:!!o.stairs});
  const Lt=lights.reduce((a,l)=>a+((S.screen&&!l.stairs)?l.v*0.5:l.v),0);
  let snd=personSound()+t.sound+(o.sound||0);
  const m=P('miso');if(here(m)&&!m.isolated&&m.hp>=20)snd-=3;
  snd=Math.max(0,snd);if(t.soundHalf||o.soundHalf)snd*=0.5;
  const threat=o.threat!=null?o.threat:t.threat;
  const def=defense()+t.def+(o.def||0);
  return clamp(Math.round(5+living+Lt+snd*1.5+density()+threat-def),3,95);
}
function applyOptStatic(o){const t=S.tonight;if(o.light)t.lights.push({v:o.light,stairs:!!o.stairs});if(o.sound)t.sound+=o.sound;if(o.lightsOff)t.lightsOff=true;if(o.soundHalf)t.soundHalf=true;if(o.threat!=null)t.threat=o.threat;if(o.def)t.def+=o.def;}

function O(key,title,desc,o){return Object.assign({key,title,desc,tags:[],light:0,stairs:false,sound:0,def:0},o);}
function expRun(fx,team,c,o){
  team.forEach(t=>t.p.busy=true);
  const j=judge(c,!o.noHalf);const head=`판정 ${c}% · 굴림 ${j.r} → `;
  if(j.res==='ok'){o.ok();S.expSuccess++;S.today.exp=team.map(t=>t.p.id);return R('relief',o.okT,head+'성공');}
  if(j.res==='half'){if(o.half)o.half();return R('relief',o.halfT||'무리의 발소리에 서둘러 물러났다. 절반만 챙겨 무사히 돌아왔다.',head+'아까운 실패 · 절반');}
  expFail(team,fx);return R('crisis',o.failT,head+'실패');
}
function expFail(team,fx){
  const dmg=team.some(t=>t.p.id==='sungjin')?10:20;
  team.forEach(t=>hpd(t.p,-dmg,fx));
  if(roll()<=40)biteSuspect(pick(team).p,fx);
}

function prepOption(o,extra){

  }
  const tags=[];
  if(o.c!=null)tags.push({t:`${o.judgeLabel||(o.sig!=null?'성공':'원정 성공')} ${o.c}%`+(o.team?` (${names(o.team)})`:''),k:'c'});
  o.tags.forEach(t=>tags.push({t,k:/\?/.test(t)?'q':''}));
  if(o.light)tags.push({t:`빛 +${o.light}`+(o.stairs?' (계단 위)':''),k:''});

/* 밤 판정 */
function doNight(){
  const fx=[];const lines=[];
  S.tonight.wasDark=S.blackout||S.tonight.lightsOff;
  let sneak=0;live().filter(p=>p.mo<=24&&!p.isolated).forEach(p=>{if(roll()<=30){sneak+=10;lines.push(`${p.short}가 몰래 휴대폰 화면을 켰다. 가족 사진이었다.`);}});
  if(sneak)S.tonight.lights.push({v:sneak,stairs:false});
  const risk=nightRisk();const r=roll();let text;let raid=false;
  if(r<=risk){
    raid=true;S.segRaid[seg()]=true;
    let bi=['잠잠','주의','경계','위험'].indexOf(riskBand(risk));
    if(S.battery>=2){res('battery',-2,fx);bi--;lines.push('손전등 반격 — 피해가 한 구간 줄었다.');}
    text=`습격 ${risk}% · 굴림 ${r} → 습격 발생`;
    raidDamage(bi,fx,lines,false);
  } else text=`습격 ${risk}% · 굴림 ${r} → `+(risk<=15?'조용한 밤':'아슬아슬하게 지나간 밤');
  if(S.day===9)lines.push('새벽, 출구 계단 아래까지 발소리가 내려왔다.');
  return {text,fx,lines,raid,risk,roll:r};
}
function raidTargets(n){
  const out=[],used=new Set();const add=p=>{if(out.length<n&&here(p)&&!p.isolated&&!used.has(p.id)){used.add(p.id);out.push(p);}};
  ORDER.def.forEach(id=>{const p=P(id);if(here(p)&&p.hp>=50)add(p);});
  live().filter(p=>!WEAK.includes(p.id)&&p.hp>=50).sort((a,b)=>b.hp-a.hp).forEach(add);
  live().filter(p=>!WEAK.includes(p.id)).sort((a,b)=>b.hp-a.hp).forEach(add);
  WEAK.forEach(id=>add(P(id)));
  return out;
}
function raidDamage(bi,fx,lines,inside){
  if(bi<0){lines.push('빛에 눈이 부신 그림자들이 계단 위로 물러났다. 피해 없음.');return;}
  if(bi===0){moAll(-2,fx);lines.push('배회하던 한두 마리가 셔터를 긁다 사라졌다.');return;}
  const spec=[null,{n:1,d:15,b:0},{n:2,d:20,b:1},{n:3,d:25,b:3}][bi];
  const tg=raidTargets(spec.n);
  tg.forEach(p=>hpd(p,-(spec.d-(p.id==='taeo'?5:0)),fx));
  lines.push(inside?'대합실 안에서 비명이 터졌다.':['','무리가 셔터를 밀었다.','떼가 바리케이드를 넘어왔다.','물결처럼 밀려들었다.'][bi]);
  if(spec.b===1){if(tg.length&&roll()<=30)biteSuspect(pick(tg),fx);}
  if(spec.b===3){tg.forEach(p=>{if(roll()<=30)biteSuspect(p,fx);});
    const dy=live().filter(p=>p.hp<=19);if(dy.length&&roll()<=50){const v=pick(dy);if(kill(v,'습격'))lines.push(`${v.short}가 끝내 일어나지 못했다.`);}}
}

function doSettle(){
  const fx=[];const events=[];const n=live().length;
  // 자원
  let fc=Math.round(n*0.8);if(S.halfRation>0)fc=Math.round(fc/2);
  res('food',-fc,fx);if(S.day<=8)res('food',here(P('eunbi'))?5:3,fx);
  res('water',-Math.ceil(n*0.5),fx);
  const isoA=live().filter(p=>p.isolated&&p.bite&&p.bite.rule==='A').length;if(isoA)res('water',-2*isoA,fx);
  if(S.solar)res('battery',1,fx);
  if(S.blackout){if(S.battery>=1){res('battery',-1);S.blackout=false;events.push({t:'배터리가 생겨 랜턴이 다시 켜졌다.',k:'g'});}}
  else if(S.day%2===0){if(S.battery>=1)res('battery',-1,fx);else{S.blackout=true;events.push({t:'랜턴을 충전할 배터리가 없다. 완전 소등.',k:'r'});}}
  // 체력
  if(S.food<=19){hpAll(-5);fx.push('기근 · 체력(전체) −5');}
  if(S.water<=0){hpAll(-10);fx.push('갈증 · 체력(전체) −10');}
  const f=(S.food<40?0.5:1)*(S.blackout?0.5:1);
  const cg=caregiverId();const cgAmt=(cg==='yunhee'?5:3)+(S.community>=1?1:0);
  live().forEach(p=>{
    if(p.care==='med'){if(cg)hpd(p,Math.floor(cgAmt*f));if(p.hp>=50)p.care=null;}
    else if(p.care==='haneul'){if(here(P('haneul')))hpd(p,Math.floor(3*f));else p.care=null;}
    else if(p.isolated&&p.bite&&p.bite.rule==='A'){if(cg)hpd(p,Math.floor(cgAmt*f));}
    else if(p.isolated&&p.bite&&p.bite.rule==='B'){hpd(p,-5);}
    else if(p.hp>=50&&p.hp<=79&&!p.busy){p.hp=Math.min(79,p.hp+Math.floor(5*f));}
    if(p.giving)hpd(p,-5);
    if(p.quiet>0)p.quiet--;
  });
  live().forEach(p=>{if(p.hp<=19){p.dying++;}else p.dying=0;});

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16-0.5);
function lightPass(t){

  const out=wg.createImageData(W,H),d=out.data,src=baseData;
  const lit=!S||!S.blackout;const low=S&&S.tonight&&S.tonight.lowLantern;
  const amb=lit?0.25:0.08;const LR=low?110:200;
  const fl=lit?(0.94+0.04*Math.sin(t/170)+0.025*Math.sin(t/47)):0;
  const rain=S&&S.day<=2;const sun=rain?0.45:0.7;
  const q=0.09;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const th=BAYER[(y&3)*4+(x&3)];
      let wi=0;if(lit){const dx=(x-292)*0.95,dy=(y-112)*1.15;const dd=Math.sqrt(dx*dx+dy*dy);if(dd<LR)wi=Math.pow(1-dd/LR,1.35)*1.3*fl;}
      const sx=x-470,sy=(y-26)*1.35;const sd=Math.sqrt(sx*sx+sy*sy);let si=sd<190?Math.pow(1-sd/190,1.7)*sun:0;
      wi=Math.max(0,Math.floor(wi/q+th+.5)*q);si=Math.max(0,Math.floor(si/q+th+.5)*q);
      const lr=amb+wi+si*0.86,lg=amb+wi*0.78+si*0.92,lb=amb*1.1+wi*0.45+si*1.0;
      const k=(y*W+x)*4;
      d[k]=Math.min(255,src[k]*lr);d[k+1]=Math.min(255,src[k+1]*lg);d[k+2]=Math.min(255,src[k+2]*lb);d[k+3]=255;

  }

  if(lit){wg.fillStyle=low?'#c98d2e':'#ffd476';wg.fillRect(285,66,5,7);wg.fillRect(294,70,5,7);wg.fillStyle='#fff1c4';wg.fillRect(286,68,3,3);wg.fillRect(295,72,3,3);}

function showBottom(on){$('#bottom').classList.toggle('empty',!on);}
UI.say=function(lines){
  lines=lines.filter(Boolean);
  return new Promise(res=>{
    const box=$('#dialog');let i=0;const shown=[];
    showBottom(true);box.classList.remove('compact');
    $('#choices').innerHTML='';$('#prompt').textContent='';
    const step=()=>{
      if(i>=lines.length){advanceFn=null;box.onclick=null;const f=box.querySelector('.dfoot');if(f)f.remove();res();return;}
      shown.push(lines[i++]);
      box.innerHTML=`<div class="head">상황</div>`+shown.map((l,k)=>lineHTML(l,k===shown.length-1)).join('')+`<div class="dfoot"><span>${i} / ${lines.length}</span><span class="go">▸ ${i>=lines.length?'선택으로':'계속 (클릭)'}</span></div>`;
      box.scrollTop=box.scrollHeight;
    };
    advanceFn=step;box.onclick=step;step();
  });
};
function renderChoices(){
  const {ctx,opts}=choiceState;const wrap=$('#choices');
  $('#prompt').textContent=ctx.prompt||'';
  wrap.innerHTML=opts.map((o,i)=>{
    const band=riskBand(o.risk);
    const risk=o.noRisk?'':`<div class="risk"><span>밤 습격</span><span class="bar"><i style="width:${o.risk}%;background:${BAND_COLOR[band]}"></i></span><b>${o.risk}%</b>${o.sneak?'<span class="why" title="사기가 무너진 사람이 몰래 불을 켤 수 있다">+ 몰래 켠 불?</span>':''}</div>`;
    return `<button class="opt" data-i="${i}" ${o.disabled?'disabled':''}><h3><span class="k">${o.key}</span>${esc(o.title)}</h3><p>${esc(o.desc)}</p>
    <div class="tags">${o.tagList.map(t=>`<span class="tag ${t.k}">${esc(t.t)}</span>`).join('')}</div>${o.disabled?`<div class="why">${esc(o.why)}</div>`:''}${risk}</button>`;
  }).join('');
  wrap.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choiceState.go(+b.dataset.i));
}
function refreshChoices(){if(choiceState&&choiceState.remake){choiceState.opts=choiceState.remake();if(choiceState.ctx.emergency)choiceState.opts.forEach(o=>o.noRisk=true);renderChoices();}}
UI.choose=function(ctx,opts,remake){
  return new Promise(res=>{
    showBottom(true);$('#dialog').classList.add('compact');$('#dialog').scrollTop=1e5;
    choiceState={ctx,opts,remake,go:i=>{const o=choiceState.opts[i];if(!o||o.disabled)return;chooseKeys=null;choiceState=null;closePop();$('#choices').innerHTML='';$('#prompt').textContent='';res(o);}};
    chooseKeys=i=>choiceState&&choiceState.go(i);
    renderChoices();UI.render();
  });
};
function fxHTML(arr){if(!arr||!arr.length)return '';return `<div class="fx">${arr.map(f=>`<span class="${/★|희망|합류/.test(f)?'g':/−|의심|사망/.test(f)?'r':''}">${esc(f)}</span>`).join('')}</div>`;}
function openModal(html,wide){closePop();$('#panel').className='panel'+(wide?' wide':'');$('#panel').innerHTML=html;$('#modal').classList.remove('hidden');placeSpots();}
function closeModal(){$('#modal').classList.add('hidden');$('#panel').innerHTML='';placeSpots();}
UI.card=function(c){
  return new Promise(res=>{
    let h=`<div class="lab ${c.label}">${LABEL[c.label]||''}</div><div class="pbody"><h2>${esc(c.title)}</h2>`;
    if(c.choice)h+=`<div class="sub">${esc(c.choice)}</div>`;
    if(c.looks&&c.looks.length)h+=`<div class="sec"><h4>오늘의 살핌</h4>${c.looks.map(l=>`<div class="event-line">${esc(l.name)} — ${esc(l.text)}</div>${fxHTML(l.fx)}`).join('')}</div>`;
    h+=`<div class="sec"><h4>${c.night?'① 선택 결과':'결과'}</h4><div class="txt">${esc(c.text)}</div>${c.sub?`<div class="sub">${esc(c.sub)}</div>`:''}${fxHTML(c.fx)}${c.back?`<div class="sub" style="margin-top:6px;color:var(--amberInk)">↪ 이 선택은 ${c.back}일차에 다시 돌아온다.</div>`:''}</div>`;
    if(c.night){h+=`<div class="sec"><h4>② 오늘 밤</h4><div>${esc(c.night.text)}</div>${c.night.lines.map(l=>`<div class="event-line ${c.night.raid?'r':''}">${esc(l)}</div>`).join('')}${fxHTML(c.night.fx)}</div>`;
      const st=c.settle;h+=`<div class="sec"><h4>③ 하루 정산</h4>${fxHTML(st.fx)}${st.breath?`<div class="event-line g" style="margin-top:8px">작은 숨 「${esc(st.breath.name)}」 — ${esc(st.breath.text)}</div>${fxHTML(st.breath.fx)}`:''}${st.events.map(e=>`<div class="event-line ${e.k}">${esc(e.t)}</div>`).join('')}</div>`;}
    h+=`</div><div class="actions"><button class="btn" id="cardGo">${c.night?(S.over?'아침을 맞는다':'다음 날'):'계속'}</button></div>`;
    UI.render();openModal(h);
    const go=()=>{advanceFn=null;closeModal();res();};
    $('#cardGo').onclick=go;advanceFn=go;$('#cardGo').focus({preventScroll:true});
  });
};

/* ---------- 인물 · 일지 ---------- */
function peopleHTML(title,btn){
  const all=S?S.people:CHARS.map(c=>mkP(c,true));
  const bar=(v,c)=>`<span class="bar"><i style="width:${v}%;background:${c}"></i></span>`;
  return `<div class="lab plain">${title||'인물 · 체력과 사기'}</div><div class="pbody"><div class="ppl">${all.map(p=>{
    const gone=!here(p);const st=[];
    if(gone)st.push(p.cause==='떠남'?'떠났다':`잃었다 (${p.cause||''})`);
    else{if(p.isolated)st.push('격리 중');if(p.bite)st.push('물림 의심 ?');if(p.hp<=19)st.push(`빈사 ${p.dying}일째`);else if(p.hp<=49)st.push('중상');if(p.care)st.push('간병 받는 중');if(p.mo<=24)st.push('붕괴 — 떠날 수 있다');}
    return `<div class="pc ${gone?'gone':''}"><h5>${esc(p.name)}<small>${p.age} · ${esc(p.job)}</small></h5>
    <div class="meter">체력 ${bar(p.hp,'var(--relief)')} <b>${p.hp}</b> ${hpBand(p.hp)}</div>
    <div class="meter">사기 ${bar(p.mo,'var(--amber)')} <b>${p.mo}</b> ${moBand(p.mo)}</div>
    <div class="ab">${esc(p.ab)}</div>${st.length?`<div class="stt">${st.join(' · ')}</div>`:''}</div>`;}).join('')}</div></div>
    <div class="actions"><button class="btn" id="mClose">${btn||'닫기'}</button></div>`;
}
function logHTML(final){
  const col={relief:'var(--relief)',hope:'var(--hope)',heavy:'var(--heavy)',crisis:'var(--crisis)'};
  let h=`<div class="lab plain">${final?'15일 일지':'일지'}</div><div class="pbody">`;
  if(!S||!S.log.length)h+='<p class="sub">아직 기록이 없다.</p>';
  else h+=S.log.map(e=>`<div class="logrow"><b>${e.day}일차</b><div><span class="dotlab" style="background:${col[e.label]}"></span><strong>${esc(e.title)}</strong> — ${esc(e.choice)}<div class="sub">${esc(e.text)}</div>${e.night?`<div class="sub">밤: ${esc(e.night)}</div>`:''}${e.extra.map(x=>`<div class="sub">· ${esc(x)}</div>`).join('')}</div></div>`).join('');
  if(final){
    const miss=HOPE_SRC.filter(h=>!S.hopeGot.includes(h.id));
    h+=`<div class="sec"><h4>놓친 단서 (${miss.length})</h4>${miss.map(m=>`<div class="sub">${HOPE_NAME[m.lv]} · ${esc(m.t)}</div>`).join('')||'<div class="sub">모든 단서를 찾았다.</div>'}</div>`;
    if(S.over!=='family'){const forks=S.log.filter(e=>e.label==='heavy'||e.label==='crisis').slice(-3);
      if(forks.length)h+=`<div class="sec"><h4>갈림길 셋</h4>${forks.map(e=>`<div class="event-line r">${e.day}일차 「${esc(e.title)}」 ${esc(e.choice)}</div>`).join('')}</div>`;}
  }
  h+=`</div><div class="actions"><button class="btn" id="mClose">${final?'타이틀로':'닫기'}</button></div>`;
  return h;
}
$('#btnPeople').onclick=()=>{openModal(peopleHTML(),true);$('#mClose').onclick=closeModal;};
$('#btnLog').onclick=()=>{openModal(logHTML(false),true);$('#mClose').onclick=closeModal;};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(popEl){closePop();return;}}
  if(!$('#modal').classList.contains('hidden')&&!advanceFn){if(e.key==='Escape')closeModal();return;}
  if((e.key===' '||e.key==='Enter')&&advanceFn&&!document.activeElement?.closest?.('.opt,.spot,.pop')){e.preventDefault();advanceFn();return;}
  if(chooseKeys&&!popEl){const k=e.key.toUpperCase();const i='ABC'.indexOf(k)>=0?'ABC'.indexOf(k):'123'.indexOf(k);if(i>=0){e.preventDefault();chooseKeys(i);}}
});

/* ---------- 타이틀 · 프롤로그 · 엔딩 ---------- */
function showTitle(){
  S=null;lastEv=null;choiceState=null;closePop();UI.render();$('#dialog').innerHTML='';$('#choices').innerHTML='';$('#prompt').textContent='';showBottom(false);
  const save=store.get(SAVE_KEY);const got=store.get(END_KEY)||[];
  const cv=$('#cover');cv.className='cover';
  cv.innerHTML=`<h1>소등</h1><div class="en">LIGHTS OUT</div><p class="lead">정전된 지하철 새봄역. 열 명이 보름을 버틴다. 불을 켜면 마음이 풀리고, 불나방이 온다.</p>
  <div class="row"><button class="cbtn" id="tNew">새 게임</button><button class="cbtn alt" id="tCont" ${save?'':'disabled'}>이어하기${save?` · ${save.day}일차`:''}</button></div>
  <div class="endgrid">${END_ORDER.map(k=>`<span class="${got.includes(k)?'got':''}">${got.includes(k)?ENDINGS[k].t:'？'}</span>`).join('')}</div>`;
  $('#tNew').onclick=()=>{cv.className='cover hidden';newGame();prologue();};
  $('#tCont').onclick=()=>{if(!save)return;cv.className='cover hidden';S=save;start();};
}
async function prologue(){
  S.phase='title';UI.render({title:'프롤로그',axis:'정전 첫날 밤'});
  await UI.say([N('출근 시간, 수도권 신도시의 지하철 새봄역.'),N('도심에서 시작된 회백 바이러스가 몇 시간 만에 이곳까지 번졌다. 사람들은 그들을 ‘불나방’이라 불렀다. 눈이 회백색으로 흐려진 채, 빛을 향해 걸어오는 사람들.'),N('셔터가 내려가고, 대합실에 열 명이 남았다.'),L('dokyung','비상조명은 축전지예요. 한 시간쯤 갈 겁니다.'),N('그리고 첫날 밤, 비상조명이 꺼졌다.'),L('jinseok','…랜턴 켭시다. 낮게요.'),N('이제부터 새봄역의 모든 불은, 누군가 들고 온 것이다.'),N('장면 속의 하얀 점은 살펴볼 수 있는 곳이다. 하루 세 번, 결정을 내리기 전에 대합실을 살필 수 있다.')]);
  await new Promise(r=>{openModal(peopleHTML('새봄역의 열 사람','1일차 시작'),true);$('#mClose').onclick=()=>{closeModal();r();};});
  start();
}
async function start(){
  try{await gameLoop();}catch(err){console.error(err);showBottom(true);$('#dialog').innerHTML=`<p class="line cur">오류가 발생했다: ${esc(err.message)}</p>`;}
}
UI.finish=async function(key){
  const e=ENDINGS[key];S.phase='end';
  UI.render();$('#eventtag').innerHTML='';$('#signaltag').classList.add('hidden');$('#dialog').innerHTML='';$('#choices').innerHTML='';$('#prompt').textContent='';showBottom(false);$('#spots').innerHTML='';
  let extra='';if(key==='endure'&&S.hope>=1)extra=' 어딘가 있다는 것만은 안다.';
  const cv=$('#cover');cv.className='cover ending';
  const survivors=live().map(p=>p.short).join(', ');
  cv.innerHTML=`<div class="en">${key==='dark'||key==='open'?`${S.day}일차`:'16일째 아침'}</div><h1>${esc(e.t)}</h1><p class="lead">${esc(e.txt+extra)}</p>
   <p class="lead" style="font-size:14px;margin-top:-8px">살아남은 사람: ${survivors||'없음'} · 희망 ${HOPE_NAME[S.hope]} · 평균 사기 ${avgMo()}</p>
   <div class="row"><button class="cbtn" id="eLog">15일 일지 보기</button><button class="cbtn alt" id="eTitle">타이틀로</button></div>`;
  await new Promise(r=>{
    $('#eTitle').onclick=r;
    $('#eLog').onclick=()=>{openModal(logHTML(true),true);$('#mClose').onclick=()=>{closeModal();r();};};
  });
  cv.className='cover hidden';showTitle();
};

$('#stage').prepend(world);
new ResizeObserver(layoutWorld).observe($('#stage'));
layoutWorld();
if(!REDUCED)setInterval(()=>{if(!document.hidden)lightPass(performance.now());},140);
showTitle();

</script>
